<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — UTBelajar</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-showcase-bg">
    <div class="auth-showcase-card">
      <!-- Panel Kiri: Visual Simpel & Cerah -->
      <div class="auth-showcase-visual">
        <a href="index.html" class="visual-top-brand">
          <div class="visual-brand-mark">U</div>
          <span class="visual-brand-text">UTBelajar</span>
        </a>

        <div class="visual-bottom-copy">
          <h2 class="visual-Headline">
            BELAJAR<br>
            LEBIH CERDAS!
          </h2>
          <p class="visual-subtext">
            Platform belajar mandiri untuk latihan soal, pantau progres belajar, dan diskusi bersama asisten AI.
          </p>
        </div>
      </div>

      <!-- Panel Kanan: Form Login Simpel (Nama & Password) -->
      <div class="auth-showcase-form-panel">
        <div class="auth-showcase-form-inner">
          <h1 class="showcase-form-title">SELAMAT DATANG</h1>
          <p class="showcase-form-subtitle">Masukkan nama dan password untuk masuk.</p>

          <div id="auth-alert" class="auth-alert"></div>

          <form id="login-form" class="auth-form" novalidate>
            <div class="form-group">
              <label for="login-nama" class="form-label">Nama</label>
              <input 
                type="text" 
                id="login-nama" 
                class="form-control" 
                placeholder="Masukkan nama Anda" 
                required 
                autocomplete="username"
              >
            </div>

            <div class="form-group">
              <label for="login-password" class="form-label">Password</label>
              <div class="input-password-wrapper">
                <input 
                  type="password" 
                  id="login-password" 
                  class="form-control" 
                  placeholder="Masukkan password" 
                  required 
                  autocomplete="current-password"
                >
                <button type="button" class="password-toggle-btn" aria-label="Tampilkan password">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <button type="submit" id="login-submit-btn" class="btn-showcase-submit" style="margin-top: 0.75rem;">
              <span>Masuk</span>
            </button>
          </form>

          <p class="auth-footer-prompt">
            Belum punya akun? <a href="register.html">Daftar</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
