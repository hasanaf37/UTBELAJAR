<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun — UTBelajar</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-showcase-bg">
    <div class="auth-showcase-card">
      <!-- Panel Kiri: Visual Simpel & Cerah -->
      <div class="auth-showcase-visual">
        <a href="index.html" class="visual-top-brand">
          <div class="visual-brand-mark">U</div>
          <span class="visual-brand-text">UTBelajar</span>
        </a>

        <div class="visual-bottom-copy">
          <h2 class="visual-Headline">
            MULAI<br>
            BELAJAR!
          </h2>
          <p class="visual-subtext">
            Daftar dengan mudah untuk mulai mengerjakan latihan soal sesuai program studi pilihanmu.
          </p>
        </div>
      </div>

      <!-- Panel Kanan: Form Daftar Simpel (Nama, Program Studi, Password) -->
      <div class="auth-showcase-form-panel">
        <div class="auth-showcase-form-inner">
          <h1 class="showcase-form-title">DAFTAR AKUN</h1>
          <p class="showcase-form-subtitle">Lengkapi nama, program studi, dan password.</p>

          <div id="auth-alert" class="auth-alert"></div>

          <form id="register-form" class="auth-form" novalidate>
            <div class="form-group">
              <label for="reg-fullname" class="form-label">Nama</label>
              <input 
                type="text" 
                id="reg-fullname" 
                class="form-control" 
                placeholder="Masukkan nama Anda" 
                required 
                autocomplete="name"
              >
            </div>

            <div class="form-group">
              <label for="program-studi-select" class="form-label">Program Studi</label>
              <select id="program-studi-select" class="form-control" required>
                <option value="">-- Pilih Program Studi --</option>
                <option value="b1111111-1111-1111-1111-111111111111">Sistem Informasi (SI)</option>
                <option value="b2222222-2222-2222-2222-222222222222">Manajemen (MNJ)</option>
                <option value="b3333333-3333-3333-3333-333333333333">Ilmu Komunikasi (ILKOM)</option>
                <option value="b4444444-4444-4444-4444-444444444444">Akuntansi (AKT)</option>
              </select>
            </div>

            <div class="form-group">
              <label for="reg-password" class="form-label">Password</label>
              <div class="input-password-wrapper">
                <input 
                  type="password" 
                  id="reg-password" 
                  class="form-control" 
                  placeholder="Minimal 6 karakter" 
                  required 
                  autocomplete="new-password"
                >
                <button type="button" class="password-toggle-btn" aria-label="Tampilkan password">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <button type="submit" id="register-submit-btn" class="btn-showcase-submit" style="margin-top: 0.75rem;">
              <span>Daftar</span>
            </button>
          </form>

          <p class="auth-footer-prompt">
            Sudah punya akun? <a href="index.html">Masuk</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
