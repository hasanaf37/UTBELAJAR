<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="540" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4169F5" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#815CF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#EEF3FF" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4169F5"/>
      <stop offset="100%" stop-color="#815CF8"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#172554" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4169F5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ambient circles -->
  <circle cx="270" cy="250" r="220" fill="url(#bgGlow)" />
  <circle cx="440" cy="110" r="70" fill="#815CF8" fill-opacity="0.12" filter="blur(30px)" />
  <circle cx="100" cy="380" r="90" fill="#4169F5" fill-opacity="0.1" filter="blur(35px)" />

  <!-- Main Floating Card: Learning Dashboard Preview -->
  <g transform="translate(100, 110)" filter="url(#softShadow)">
    <rect width="340" height="250" rx="20" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Header of card -->
    <rect x="24" y="24" width="48" height="10" rx="5" fill="#4169F5" fill-opacity="0.3" />
    <rect x="80" y="24" width="60" height="10" rx="5" fill="#E2E8F0" />
    <circle cx="316" cy="29" r="6" fill="#22C55E" />

    <!-- Progress Ring & Big Stat -->
    <g transform="translate(24, 60)">
      <circle cx="45" cy="45" r="40" stroke="#EEF3FF" stroke-width="8" fill="none" />
      <circle cx="45" cy="45" r="40" stroke="url(#blueAccent)" stroke-width="8" stroke-dasharray="251.2" stroke-dashoffset="60" stroke-linecap="round" fill="none" transform="rotate(-90 45 45)" />
      <text x="45" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#172554" text-anchor="middle" dominant-baseline="middle">92%</text>
      <text x="45" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="8" fill="#7B8498" text-anchor="middle">Akurasi</text>
    </g>

    <!-- Content Bar lines -->
    <g transform="translate(130, 65)">
      <rect x="0" y="0" width="140" height="12" rx="4" fill="#172554" fill-opacity="0.8" />
      <rect x="0" y="20" width="180" height="8" rx="4" fill="#94A3B8" fill-opacity="0.4" />
      <rect x="0" y="36" width="110" height="8" rx="4" fill="#94A3B8" fill-opacity="0.4" />
      <rect x="0" y="55" width="80" height="24" rx="6" fill="#EEF3FF" />
      <rect x="12" y="63" width="56" height="8" rx="3" fill="#4169F5" />
    </g>

    <!-- Mini chart bars -->
    <g transform="translate(24, 180)">
      <rect x="0" y="24" width="22" height="30" rx="5" fill="#EEF3FF" />
      <rect x="36" y="14" width="22" height="40" rx="5" fill="#EEF3FF" />
      <rect x="72" y="6" width="22" height="48" rx="5" fill="url(#blueAccent)" />
      <rect x="108" y="20" width="22" height="34" rx="5" fill="#EEF3FF" />
      <rect x="144" y="0" width="22" height="54" rx="5" fill="url(#blueAccent)" />
      <rect x="180" y="10" width="22" height="44" rx="5" fill="#EEF3FF" />
      <rect x="216" y="18" width="22" height="36" rx="5" fill="#EEF3FF" />
      <rect x="252" y="4" width="22" height="50" rx="5" fill="url(#blueAccent)" />
    </g>
  </g>

  <!-- Floating Badge: AI Assistant Active -->
  <g transform="translate(50, 60)" filter="url(#badgeShadow)">
    <rect width="180" height="58" rx="14" fill="#FFFFFF" stroke="#E2E8F0" />
    <rect x="14" y="14" width="30" height="30" rx="8" fill="url(#blueAccent)" />
    <path d="M29 22V36M22 29H36" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <text x="54" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#172554">UTBelajar AI</text>
    <text x="54" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="9" fill="#22C55E">● Siap Membantu</text>
  </g>

  <!-- Floating Badge: Skor Nilai A -->
  <g transform="translate(360, 310)" filter="url(#badgeShadow)">
    <rect width="150" height="64" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="34" cy="32" r="18" fill="url(#greenAccent)" />
    <path d="M28 32L32 36L40 28" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#172554">Nilai Latihan</text>
    <text x="62" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#10B981">100 / 100</text>
  </g>
</svg>
